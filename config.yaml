data_path: to_share/data

model: fragment-adjacency-predictor

# run identification (omit run_name to auto-generate from timestamp)
run_name:                   # e.g. "baseline", "balanced", "multitask_lambda05"
notes: ""                   # short description of this run, written into results.jsonl

n_images: 10
max_iterations: 25000
eval_every: 250
patience: 10

# evaluation
n_eval_batches: 20          # average ARI/F1 over this many fresh validation batches
balanced_clustering: true   # enforce exactly 16 fragments per cluster
